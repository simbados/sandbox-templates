# syntax=docker/sandbox-kit:3
#
# v3 workload kit for the shell-base sandbox. Build and run it from the repo root with:
#   sbx create --name <name> ./shell-base          (or `sbx run ... ./shell-base [PATH]`)
# sbx builds this directory with shell-base.dockerfile, which is generated - edit
# template.yaml / tools/*.dockerfile and run `python3 scripts/generate_dockerfile.py shell-base`.
#
# The allow list below is the sandbox's runtime egress on top of the global policy: hosts every
# project needs. Project-specific hosts belong in a project mixin (--kit), not here.
schemaVersion: "3"
kind: workload
displayName: Shell base (simbados)
description: >-
  Debian shell sandbox on Docker's hardened sbx/shell with Docker, mise (node, hunk, helix),
  supply-chain presets for npm/pnpm/uv, and the shared agent guidance.
sourceUrl: https://github.com/simbados/sandbox-templates

capabilities:
  - type: com.docker.sandbox/sbx@1

  # Agent skills bundled in the image (shell-base/skills/, tools/agent-skills.dockerfile), one entry
  # per skill directory. sbx (0.48.0+) exposes each at <destination>/<name> in every skills
  # directory a kit in the sandbox declares; claude-mixin declares /home/agent/.claude/skills.
  # Optional, because a plain shell sandbox declares no skills directory and would otherwise
  # refuse to start. sbx never overwrites a skill of the same name from the host's sbx skills
  # store: the bundled one is then skipped without an error, so don't keep copies of these
  # skills there.
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/shell-base/skills/hunk-diff
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/shell-base/skills/scan-dependencies

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # apt: Debian's archive (also serves debian-security, all architectures) and Docker's
          # hardened package repo, the base image's two apt sources
          - deb.debian.org
          - dhi.io
          # git, and release downloads for mise and its tools
          - github.com
          - api.github.com
          - "*.githubusercontent.com"
          # mise docs and metadata; mise-versions serves the version lists for `mise use`/`install`
          # (without it mise falls back to slower sources)
          - mise.jdx.dev
          - mise-versions.jdx.dev
          # Java version metadata for `mise use java@...`
          - mise-java.jdx.dev
          # hunk docs (themes, config, extensions); hunk.dev redirects to www.
          - hunk.dev
          - www.hunk.dev
          # package registries
          - nodejs.org
          - registry.npmjs.org
          - pypi.org
          - files.pythonhosted.org
          # Sigstore, for mise's GitHub attestation checks (TUF trust root; Fulcio/Rekor)
          - fulcio.sigstore.dev:443
          - rekor.sigstore.dev:443
          - tuf-repo-cdn.sigstore.dev:443
          # dependency safety scans (scan-dependencies skill)
          - api.deps.dev
          # Docker docs: sbx release notes and CLI reference
          - docs.docker.com
          # Docker Hub for the in-sandbox Docker engine
          - registry-1.docker.io
          - auth.docker.io
          # blob CDNs: Docker Hub redirects downloads to either one
          - production.cloudflare.docker.com
          - production.cloudfront.docker.com
