name: Update pinned release hashes

on:
  pull_request:
    paths:
      - "**/Dockerfile"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-hashes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  update-hashes:
    # Only ever run against PRs actually opened by the Renovate app, or a manual
    # dispatch (already gated by GitHub's own write-access requirement for that
    # trigger). Prevents an arbitrary fork PR from getting this job to fetch
    # attacker-influenced URLs or push commits.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Fetch real hashes from GitHub releases and compare
        run: python3 scripts/update_hashes.py

      - name: Read result
        id: result
        # hash_update_result.txt holds one changed Dockerfile path per line,
        # written by the script above; empty file means nothing drifted.
        run: |
          if [ -s hash_update_result.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit corrected hashes via GitHub API
        # Goes through the Git Data API instead of `git commit`/`git push` so
        # the resulting commit shows up as "Verified" on GitHub (GitHub signs
        # commits it creates via its own API; a plain CLI commit pushed with
        # GITHUB_TOKEN does not get a signature, so it shows as unverified).
        if: steps.result.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/commit_via_api.sh

      - name: Fail if hashes drifted outside a PR
        if: steps.result.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::Pinned hashes drifted from upstream in the following Dockerfile(s):"
          cat hash_update_result.txt
          exit 1
