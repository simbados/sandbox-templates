name: Update pinned release hashes

on:
  pull_request:
    # Renovate bumps MISE_VERSION in tools/mise.dockerfile, tool versions in
    # */mise.toml (via Renovate's native mise manager), and base_image in
    # template.yaml - never the generated **/Dockerfile or kit
    # <template>/<template>.dockerfile itself (build artifacts regenerated below,
    # and disabled as Renovate targets in renovate.json to avoid them clobbering
    # these on regen). config/ and keys/ are copied into kit templates' shared/, so
    # editing them also needs a regenerate.
    paths:
      - "tools/**"
      - "**/mise.toml"
      - "**/template.yaml"
      - "config/**"
      - "keys/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-hashes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  update-hashes:
    # Only ever run against PRs actually opened by the Renovate app, or a manual
    # dispatch (already gated by GitHub's own write-access requirement for that
    # trigger). Prevents an arbitrary fork PR from getting this job to fetch
    # attacker-influenced URLs or push commits.
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Gates which mise *binary* release this step installs - separate from, and unrelated
          # to, the minimum_release_age set in shell-base/mise.toml, which
          # gates the age of the tools mise then installs (node/pnpm/uv). Without this, the step
          # would just install whatever mise release is currently latest.
          minimum_release_age: 7d

      - name: Refresh mise lockfiles
        # Re-resolves checksums/URLs for the currently-configured (exact-pinned) versions in each
        # image's mise.toml, e.g. after Renovate's native `mise` manager bumps a version there -
        # the direct successor to archive/scripts/update_hashes.py's job. Not --bump: our tools
        # are pinned to exact versions, not fuzzy specs, so we only want fresh checksums for
        # whatever's already configured, not to re-resolve to a newer version here.
        run: |
          for dir in shell-base; do
            (cd "$dir" && mise trust mise.toml && mise lock --platform linux-x64,linux-arm64)
          done

      - name: Regenerate Dockerfiles from templates
        # Fragment/template.yaml edits (this PR's own diff, e.g. a MISE_VERSION or base_image
        # bump) only take effect in the generated **/Dockerfile (or kit
        # <template>/<template>.dockerfile) once re-assembled - see
        # scripts/generate_dockerfile.py. mise.lock changes from the previous step don't affect
        # generated Dockerfile content (they're a separate COPY'd file), but regenerating here is
        # still required whenever this PR touched a fragment or template.yaml.
        run: python3 scripts/generate_dockerfile.py

      - name: Collect changed files
        id: result
        # Covers both the mise.lock refresh above and any generated Dockerfile
        # drift pulled in by the regenerate step; empty means nothing needs
        # committing.
        run: |
          # Untracked files too: a kit template's first regenerate creates new
          # <template>/shared/ copies.
          { git diff --name-only; git ls-files --others --exclude-standard -- '*/shared/*'; } > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit corrected hashes and Dockerfiles via GitHub API
        # Goes through the Git Data API instead of `git commit`/`git push` so
        # the resulting commit shows up as "Verified" on GitHub (GitHub signs
        # commits it creates via its own API; a plain CLI commit pushed with
        # GITHUB_TOKEN does not get a signature, so it shows as unverified).
        if: steps.result.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/commit_via_api.sh

      - name: Fail if pins or generated Dockerfiles drifted outside a PR
        if: steps.result.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::Pinned hashes or generated Dockerfiles drifted from source:"
          cat changed_files.txt
          exit 1
