name: Update pinned release hashes

on:
  pull_request:
    # Renovate bumps *_VERSION pins in tools/*.dockerfile fragments and
    # base_image in template.yaml - never the generated **/Dockerfile itself
    # (that's a build artifact regenerated below, and disabled as a Renovate
    # target in renovate.json to avoid it clobbering these on regen).
    paths:
      - "tools/**"
      - "**/template.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-hashes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  update-hashes:
    # Only ever run against PRs actually opened by the Renovate app, or a manual
    # dispatch (already gated by GitHub's own write-access requirement for that
    # trigger). Prevents an arbitrary fork PR from getting this job to fetch
    # attacker-influenced URLs or push commits.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Fetch real hashes from GitHub releases and compare
        run: python3 scripts/update_hashes.py

      - name: Regenerate Dockerfiles from templates
        # Fragment/template.yaml edits above (this PR's own diff, plus any
        # hash fix from the previous step) only take effect in the generated
        # **/Dockerfile once re-assembled - see scripts/generate_dockerfile.py.
        run: python3 scripts/generate_dockerfile.py

      - name: Collect changed files
        id: result
        # Covers both the fragment hash fixes above and any generated
        # Dockerfile drift pulled in by the regenerate step; empty means
        # nothing needs committing.
        run: |
          git diff --name-only > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit corrected hashes and Dockerfiles via GitHub API
        # Goes through the Git Data API instead of `git commit`/`git push` so
        # the resulting commit shows up as "Verified" on GitHub (GitHub signs
        # commits it creates via its own API; a plain CLI commit pushed with
        # GITHUB_TOKEN does not get a signature, so it shows as unverified).
        if: steps.result.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/commit_via_api.sh

      - name: Fail if pins or generated Dockerfiles drifted outside a PR
        if: steps.result.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::Pinned hashes or generated Dockerfiles drifted from source:"
          cat changed_files.txt
          exit 1
